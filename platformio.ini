[env:esp8266_radio]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Internet radio decoding benefits significantly from 160 MHz
board_build.f_cpu = 160000000L

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH

lib_deps =
    earlephilhower/ESP8266Audio
    olikraus/U8g2